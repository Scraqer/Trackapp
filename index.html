<script type="text/babel" data-presets="env" data-plugins="transform-react-jsx">
const { useState, useRef, useEffect } = React;
 
const STORAGE_KEY  = "trackapp-v1";
const BLISTERS_KEY = "trackapp-blisters-v1";
const STREAK_KEY   = "trackapp-streak-v1";
const LAST_STREAK_DATE_KEY = "trackapp-last-streak-date-v1";

const NOTIF_TIME_KEY    = "trackapp-notif-time-v1";
const NOTIF_WORKER_URL_KEY = "trackapp-notif-worker-url-v1";
const NOTIF_VAPID_KEY   = "trackapp-notif-vapid-v1";

// ============================================================================

// ============================================================================
const DEFAULT_NOTIF_WORKER_URL       = "https://trackapp-worker.domgwizdz.workers.dev"; // URL Workera (✅ bezpieczny w kodzie)
const DEFAULT_NOTIF_VAPID_PUBLIC_KEY = ""; // <-- LINIA 102: Wklej tu swój Public Key VAPID (✅ bezpieczny w kodzie)
// ============================================================================
 
const MONTHS = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec",
                "Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
const DAYS   = ["Pn","Wt","Śr","Cz","Pt","Sb","Nd"];
 
const C = {
  crimson:"#C81D3A", coral:"#FF5C8A",
  blush:"#FF9FB5",   pale:"#FFE3EC",
  dark:"#7A2E40",    text:"#3d1520",
  red:"#FF272A",     freak:"#80009f",
  error:"#ff0922",   skipped:"#A34B68"
};
 
const BAND = ["rgba(255,255,255,0.18)","rgba(255,159,181,0.18)","rgba(200,216,255,0.18)","rgba(200,240,224,0.18)"];

const DEFAULT_GIF_HAPPY = [
  "https://media1.tenor.com/m/WsWej1C3ePYAAAAC/yippee-cat-kitty.gif",
  "https://media1.tenor.com/m/9Nr32cJWZ8oAAAAC/catto.gif",
  "https://media1.tenor.com/m/lfDATg4Bhc0AAAAC/happy-cat.gif",

]; 
const DEFAULT_GIF_SAD = [
  "https://media1.tenor.com/m/-Wuv0jd3s40AAAAd/spearhyunho.gif",
  "https://media1.tenor.com/m/tuzl1hVGlIQAAAAC/sad-cat-sad-cat-meme.gif",
  "https://media1.tenor.com/m/t9PLz06a24wAAAAC/sad-cat.gif",
  "https://media.tenor.com/u4mpua8vD3IAAAAi/%C3%BCzg%C3%BCnkedikuzeyefe.gif",
  "https://media.tenor.com/-2rbVbnfW24AAAAi/crying-cat-sad-kitty.gif"
];
const Messages = ["Świetnie kochanie💕💕💕💕","Kocham cie❤️❤️❤️❤️","Jestem dumny!💖💖💖💖","Wyśle ci bicepsy💪💪","Świetna robota kochanie!😘 😘 😘 😘"];
 
const ls  = (k,d) => { try { const v=localStorage.getItem(k); return v!=null?JSON.parse(v):d; } catch{return d;} };
const lss = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };
const fmtKey = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

function getLogicalDate(dt = new Date()) {
  const d = new Date(dt);
  d.setHours(d.getHours() - 3);
  return d;
}
 
function shiftDate(key, n) {
  const [y,m,d] = key.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return fmtKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
const bEnd    = b => shiftDate(b.start, b.days - 1);
const short   = k => { const [,m,d]=k.split("-").map(Number); return `${d}.${String(m).padStart(2,"0")}`; };
 
function buildCells(y,m) {
  const first  = new Date(y,m,1).getDay();
  const offset = (first+6)%7;
  const total  = new Date(y,m+1,0).getDate();
  const arr = Array(offset).fill(null);
  for (let d=1;d<=total;d++) arr.push(d);
  return arr;
}
 
function App() {
  const logicalNow = getLogicalDate();
  const todayKey   = fmtKey(logicalNow.getFullYear(), logicalNow.getMonth(), logicalNow.getDate());
 
  const [activeTab, setActiveTab] = useState("main");
  const [data,     setData]     = useState(() => ls(STORAGE_KEY, {}));
  const [blisters, setBlisters] = useState(() => ls(BLISTERS_KEY, []));
 
  const [yr,      setYr]      = useState(logicalNow.getFullYear());
  const [mo,      setMo]      = useState(logicalNow.getMonth());
  const [slideDir,setSlideDir]= useState(0);
  const [animKey, setAnimKey] = useState(0);
 
  const [sheetDayOpen,     setSheetDayOpen]     = useState(false);
  const [selDate,          setSelDate]           = useState(todayKey);
 
  const [sheetBlisterOpen, setSheetBlisterOpen] = useState(false);
  const [bMode,            setBMode]            = useState("menu");
  const [editId,           setEditId]           = useState(null);
  const [formStart,        setFormStart]        = useState("");
  const [formDays,         setFormDays]         = useState("28");

  const [sheetStatsOpen,   setSheetStatsOpen]   = useState(false);
  const [deleteConfirmOpen, setDeleteConfirmOpen] = useState(false);
  const [deleteConfirmId,   setDeleteConfirmId]   = useState(null);

  const [streakModalOpen,   setStreakModalOpen]   = useState(false);
  const [numpadOpen,        setNumpadOpen]        = useState(false);
  const [numpadValue,       setNumpadValue]       = useState("");
  const [secretMenuOpen,    setSecretMenuOpen]    = useState(false);
  const [secretStreakVal,   setSecretStreakVal]   = useState("");
  const [currentStreak,     setCurrentStreak]     = useState(() => {
    const stored = ls(STREAK_KEY, null);
    return stored || 0;
  });
  const [lastStreakDate,    setLastStreakDate]    = useState(() => {
    const stored = ls(LAST_STREAK_DATE_KEY, null);
    return stored || null;
  });

  const [happyGifs, setHappyGifs] = useState(DEFAULT_GIF_HAPPY);
  const [sadGifs, setSadGifs]     = useState(DEFAULT_GIF_SAD);
  const [activeGif, setActiveGif] = useState("");
 
  const [notifEnabled,   setNotifEnabled]   = useState(() => ls(NOTIF_ENABLED_KEY, false));
  const [notifTime,      setNotifTime]      = useState(() => ls(NOTIF_TIME_KEY, "20:00"));
  const [notifWorkerUrl, setNotifWorkerUrl] = useState(() => ls(NOTIF_WORKER_URL_KEY, DEFAULT_NOTIF_WORKER_URL));
  const [notifVapidKey,  setNotifVapidKey]  = useState(() => ls(NOTIF_VAPID_KEY, DEFAULT_NOTIF_VAPID_PUBLIC_KEY));
  const [notifPermission,setNotifPermission]= useState(() => typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [notifStatusMsg, setNotifStatusMsg] = useState("");
  const [notifConfigOpen,setNotifConfigOpen] = useState(false);

  const [pickMode, setPickMode] = useState(false);
  const touchX = useRef(null);

  // Rejestracja Service Workera
  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log("Service Worker zarejestrowany:", reg.scope);
        })
        .catch(err => {
          console.warn("Błąd rejestracji Service Workera:", err);
        });
    }
  }, []);

  // Pomocnik do konwersji klucza publicznego VAPID urlBase64 na Uint8Array
  const urlBase64ToUint8Array = (base64String) => {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  };

  // Funkcja subskrypcji Web Push i wysyłki do Cloudflare Workera
  const syncPushSubscription = async (enabled, timeVal, targetWorkerUrl, targetVapid) => {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      setNotifStatusMsg("Twoje urządzenie nie wspiera Web Push");
      return;
    }
    try {
      const reg = await navigator.serviceWorker.ready;
      if (!enabled) {
        setNotifStatusMsg("Powiadomienia wyłączone");
        return;
      }

      const vapidKeyToUse = (targetVapid || DEFAULT_NOTIF_VAPID_PUBLIC_KEY || "").trim();
      const workerUrlToUse = (targetWorkerUrl || DEFAULT_NOTIF_WORKER_URL || "").trim().replace(/\/$/, '');

      if (!vapidKeyToUse) {
        setNotifStatusMsg("⚠️ Brak klucza VAPID! Wpisz go w Chmurze lub kodzie");
        return;
      }

      let sub = await reg.pushManager.getSubscription();
      const vapidBytes = urlBase64ToUint8Array(vapidKeyToUse);

      // Jeśli subskrypcja istnieje, ale klucz serwera się zmienił - odświeżamy
      if (sub && sub.options && sub.options.applicationServerKey) {
        const curKey = new Uint8Array(sub.options.applicationServerKey);
        let match = curKey.length === vapidBytes.length;
        if (match) {
          for (let i = 0; i < curKey.length; i++) {
            if (curKey[i] !== vapidBytes[i]) { match = false; break; }
          }
        }
        if (!match) {
          await sub.unsubscribe();
          sub = null;
        }
      }

      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: vapidBytes
        });
      }

      if (workerUrlToUse) {
        setNotifStatusMsg("Łączenie z chmurą...");
        const res = await fetch(`${workerUrlToUse}/subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subscription: sub, time: timeVal })
        });
        if (res.ok) {
          setNotifStatusMsg("Zsynchronizowano z chmurą ✅");
        } else {
          setNotifStatusMsg(`Błąd serwera chmury ⚠️ (${res.status})`);
        }
      } else {
        setNotifStatusMsg("Zapisano (wpisz URL Workera w Chmurze)");
      }
    } catch (err) {
      console.warn("Błąd Push:", err);
      setNotifStatusMsg("Błąd subskrypcji: " + (err.message || "sprawdź klucz VAPID"));
    }
  };

  // Sprawdzanie lokalne w tle podczas otwartej aplikacji
  useEffect(() => {
    if (!notifEnabled || !notifTime) return;
    const interval = setInterval(() => {
      const now = new Date();
      const curTime = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      if (curTime === notifTime && now.getSeconds() === 0) {
        const lNow = getLogicalDate();
        const curToday = fmtKey(lNow.getFullYear(), lNow.getMonth(), lNow.getDate());
        const todayEntry = data[curToday];
        if (!todayEntry || !todayEntry.tabletka) {
          if (typeof Notification !== "undefined" && Notification.permission === "granted") {
            try {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(reg => {
                  reg.showNotification("Trackapp 💊", {
                    body: "Pamiętaj o wzięciu tabletki! 💕",
                    icon: "https://cdn.jsdelivr.net/gh/TWOJ-USER/TWOJE-REPO@main/icons/icon.png",
                    tag: "trackapp-pill-reminder",
                    renotify: true
                  });
                });
              } else {
                new Notification("Trackapp 💊", {
                  body: "Pamiętaj o wzięciu tabletki! 💕",
                  icon: "https://cdn.jsdelivr.net/gh/TWOJ-USER/TWOJE-REPO@main/icons/icon.png"
                });
              }
            } catch (e) {
              console.warn(e);
            }
          }
        }
      }
    }, 1000);
    return () => clearInterval(interval);
  }, [notifEnabled, notifTime, data]);

  const handleToggleNotif = async () => {
    if (typeof Notification === "undefined") {
      alert("Twoja przeglądarka nie wspiera powiadomień.");
      return;
    }

    if (!notifEnabled) {
      // Prośba o uprawnienia
      let perm = Notification.permission;
      if (perm !== "granted") {
        perm = await Notification.requestPermission();
        setNotifPermission(perm);
      }
      if (perm === "granted") {
        setNotifEnabled(true);
        lss(NOTIF_ENABLED_KEY, true);
        syncPushSubscription(true, notifTime, notifWorkerUrl, notifVapidKey);
      } else {
        alert("Powiadomienia zostały zablokowane w ustawieniach przeglądarki lub systemu.");
      }
    } else {
      setNotifEnabled(false);
      lss(NOTIF_ENABLED_KEY, false);
      setNotifStatusMsg("Powiadomienia wyłączone");
    }
  };

  const handleTimeChange = (e) => {
    const val = e.target.value;
    setNotifTime(val);
    lss(NOTIF_TIME_KEY, val);
    if (notifEnabled) {
      syncPushSubscription(true, val, notifWorkerUrl, notifVapidKey);
    }
  };

  const testNotification = async () => {
    if (typeof Notification === "undefined") {
      alert("Powiadomienia nie są obsługiwane na tym urządzeniu.");
      return;
    }
    let perm = Notification.permission;
    if (perm !== "granted") {
      perm = await Notification.requestPermission();
      setNotifPermission(perm);
    }
    if (perm === "granted") {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification("Trackapp 💊", {
          body: `Lokalny test powiadomienia! Zaplanowano na godz. ${notifTime}.`,
          icon: "https://cdn.jsdelivr.net/gh/TWOJ-USER/TWOJE-REPO@main/icons/icon.png",
          badge: "https://cdn.jsdelivr.net/gh/TWOJ-USER/TWOJE-REPO@main/icons/icon.png",
          vibrate: [200, 100, 200],
          tag: "trackapp-test"
        });
      } else {
        new Notification("Trackapp 💊", {
          body: `Lokalny test powiadomienia! Zaplanowano na godz. ${notifTime}.`,
          icon: "https://cdn.jsdelivr.net/gh/TWOJ-USER/TWOJE-REPO@main/icons/icon.png"
        });
      }

      // Jeśli skonfigurowano URL chmury, wyślij test z chmury przez Web Push
      const workerUrlToUse = (notifWorkerUrl || DEFAULT_NOTIF_WORKER_URL || "").trim().replace(/\/$/, '');
      if (workerUrlToUse && 'serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          const sub = await reg.pushManager.getSubscription();
          if (sub) {
            setNotifStatusMsg("Wysyłam test przez serwer chmury...");
            const res = await fetch(`${workerUrlToUse}/test`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ subscription: sub })
            });
            if (res.ok) {
              setNotifStatusMsg("Powiadomienie z chmury wysłane pomyślnie! 🚀");
              return;
            } else {
              setNotifStatusMsg(`Błąd chmury: ${res.status}`);
              return;
            }
          }
        } catch (e) {
          console.warn("Błąd testu chmury:", e);
        }
      }
      setNotifStatusMsg("Wysłano test powiadomienia! 🔔");
    } else {
      alert("Brak uprawnień do powiadomień!");
    }
  };

  useEffect(() => {
    async function fetchGifs() {
      try {
        const res = await fetch("./gifs.json?t=" + new Date().getTime());
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            setHappyGifs(json);
          } else if (json && typeof json === 'object') {
            if (Array.isArray(json.happy) && json.happy.length > 0) setHappyGifs(json.happy);
            if (Array.isArray(json.sad) && json.sad.length > 0) setSadGifs(json.sad);
          }
        }
      } catch (e) {
        console.warn("Nie udało się pobrać gifs.json. Używam domyślnych gifów.", e);
      }
    }
    fetchGifs();
  }, []);

  useEffect(() => {
    if (streakModalOpen) {
      const pool = currentStreak > 0 ? happyGifs : sadGifs;
      const randomImg = pool[Math.floor(Math.random() * pool.length)];
      setActiveGif(randomImg);
    }
  }, [streakModalOpen, currentStreak, happyGifs, sadGifs]);

  useEffect(() => {
    const checkStreakValidity = () => {
      const lNow = getLogicalDate();
      const tStr = fmtKey(lNow.getFullYear(), lNow.getMonth(), lNow.getDate());
      const yest = new Date(lNow);
      yest.setDate(yest.getDate() - 1);
      const yStr = fmtKey(yest.getFullYear(), yest.getMonth(), yest.getDate());
      const storedStreak = ls(STREAK_KEY, 0);
      const storedLast   = ls(LAST_STREAK_DATE_KEY, null);
      if (storedStreak > 0 && (!storedLast || (storedLast !== tStr && storedLast !== yStr))) {
        setCurrentStreak(0);
        lss(STREAK_KEY, 0);
        lss(LAST_STREAK_DATE_KEY, null);
        setLastStreakDate(null);
      }
    };

    checkStreakValidity();

    const n = new Date();
    let nextReset = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 3, 0, 0, 0);
    if (n >= nextReset) {
      nextReset.setDate(nextReset.getDate() + 1);
    }
    const timer = setTimeout(checkStreakValidity, nextReset - n + 1000);
    return () => clearTimeout(timer);
  }, []);

  const toggle = field => {
    const e = {...(data[selDate]||{})};
    e[field] = !e[field];

    if (field === "pominieta" && e.pominieta) {
      e.tabletka = false;
    } else if (field === "tabletka" && e.tabletka) {
      e.pominieta = false;
    }

    const next = {...data};
    if (!e.tabletka && !e.freaky && !e.krwawienie && !e.pominieta) delete next[selDate];
    else next[selDate] = e;
    setData(next);
    lss(STORAGE_KEY, next);

    const curLogicalNow = getLogicalDate();
    const curTodayKey = fmtKey(curLogicalNow.getFullYear(), curLogicalNow.getMonth(), curLogicalNow.getDate());

    if (field === "pominieta" && e.pominieta && selDate === curTodayKey) {
      setCurrentStreak(0);
      lss(STREAK_KEY, 0);
      lss(LAST_STREAK_DATE_KEY, null);
      setLastStreakDate(null);
      return;
    }
    
    if (field === "tabletka") {

          lss(LAST_STREAK_DATE_KEY, curTodayKey);

          setLastStreakDate(yesterdayKey);

    const totalDays = new Date(year, month + 1, 0).getDate();
    const lNow = getLogicalDate();
    const today = new Date(lNow.getFullYear(), lNow.getMonth(), lNow.getDate());
    
    let krwawieniaCount = 0;
    let freakyCount = 0;
    let noTabletkaCount = 0;
    let noTabletkaDay = [];
    
    for (let d = 1; d <= totalDays; d++) {
      const key = fmtKey(year, month, d);
      const dayData = data[key];
      const currentDate = new Date(year, month, d);
      
      if (dayData) {
        if (dayData.krwawienie) krwawieniaCount++;
        if (dayData.freaky) freakyCount++;
      }

      const isPast = currentDate < today;
      const isPominieta = dayData?.pominieta || (isPast && !dayData?.tabletka);

      if (isPominieta) {
        noTabletkaCount++;
        noTabletkaDay.push(d);
      }
    }
    
    const freakyPct = Math.round((freakyCount / totalDays) * 100);
    
    return {

              })}
            </div>
          </>
        )}
 
        {bMode==="edit" && (
          <>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <button onClick={()=>setBMode("modify")}
                style={{background:C.pale,border:"none",borderRadius:12,padding:"8px 14px",
                  cursor:"pointer",fontSize:14,fontWeight:800,color:C.crimson}}>← Wróć</button>
              <div style={{fontSize:12,fontWeight:800,color:C.blush,letterSpacing:1.5,textTransform:"uppercase"}}>
                Edytuj blister
              </div>
            </div>
            <BlisterForm
              formStart={formStart} setFormStart={setFormStart}
              formDays={formDays}   setFormDays={setFormDays}
              onSave={saveBlister}  onPickCalendar={startPickOnCalendar}
              C={C} saveLabel="Zapisz zmiany"
            />
          </>
        )}
 
      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",
        transform:`translateX(-50%) translateY(${sheetStatsOpen?"0":"105%"})`,
        width:"100%",maxWidth:430,background:"rgba(255,255,255,0.95)",
        backdropFilter:"blur(20px)",
        borderRadius:"32px 32px 0 0",
        padding:"14px 22px 52px",zIndex:11,
        transition:"transform .38s cubic-bezier(.34,1.2,.64,1)",
        boxShadow:"0 -8px 48px rgba(139,0,139,.14)",
        borderTop:"1px solid rgba(255,255,255,0.8)"}}>

        <div style={{width:40,height:4,borderRadius:2,background:C.pale,margin:"0 auto 22px"}}/>
        <div style={{fontSize:12,fontWeight:800,color:C.blush,letterSpacing:1.8,
          marginBottom:24,textTransform:"uppercase",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span>Statystyki {MONTHS[mo]}</span>
          <button onClick={()=>setSheetStatsOpen(false)}
            style={{background:"rgba(139,0,139,.1)",border:"none",borderRadius:10,
              padding:"5px 12px",color:"#8B008B",fontWeight:900,cursor:"pointer",fontSize:16}}>
            ✕
          </button>
        </div>

        {(() => {
          const stats = getMonthStats(yr, mo);
          return (
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{padding:"16px 20px",borderRadius:22,background:"#f8f0ff",
                border:`2px solid #80009f`}}>
                <div style={{fontSize:12,fontWeight:800,color:C.freak,letterSpacing:1.2,marginBottom:6,textTransform:"uppercase"}}>
                 😈 Ilość Freaku
                </div>
                <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:4}}>
                  <div style={{fontSize:26,fontWeight:900,color:"#80009f"}}>
                    {stats.freakyCount}
                  </div>
                  <div style={{fontSize:18,fontWeight:700,color:"#80009f"}}>
                    ({stats.freakyPct}%)
                  </div>
                </div>
                <div style={{fontSize:11,fontWeight:600,color:C.dark,opacity:.5}}>
                  z {stats.totalDays} dni w miesiącu
                </div>
              </div>

              <div style={{padding:"16px 20px",borderRadius:22,background:"#fff0ff",
                border:`2px solid #FF5C8A`}}>
                <div style={{fontSize:12,fontWeight:800,color:C.blush,letterSpacing:1.2,marginBottom:6,textTransform:"uppercase"}}>
                   Ilość krwawień
                </div>
                <div style={{fontSize:26,fontWeight:900,color:C.crimson}}>
                  {stats.krwawieniaCount}
                </div>
                <div style={{fontSize:11,fontWeight:600,color:C.dark,opacity:.5,marginTop:4}}>
                  z {stats.totalDays} dni w miesiącu
                </div>
              </div>

              <div style={{padding:"16px 20px",borderRadius:22,background:stats.noTabletkaCount===0?"#f0fff4":"#FFF2F5",
                border:`2px solid ${stats.noTabletkaCount===0?"#27ae60":C.skipped}`}}>
                <div style={{fontSize:12,fontWeight:800,color:C.skipped,letterSpacing:1.2,marginBottom:6,textTransform:"uppercase"}}>
                  Pominięte tabletki
                </div>
                {stats.noTabletkaCount === 0 ? (
                  <div style={{fontSize:18,fontWeight:900,color:"#27ae60",lineHeight:1.6}}>
                    😘 Dobra Robota!
                  </div>
                ) : (
                  <div style={{fontSize:14,fontWeight:700,color:C.skipped,lineHeight:1.6}}>
                    {stats.noTabletkaDay.join(", ")}
                  </div>
                )}
                <div style={{fontSize:11,fontWeight:600,color:C.dark,opacity:.5,marginTop:4}}>
                  {stats.noTabletkaCount} dni bez tabletki
                </div>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}
 
function BlisterForm({ formStart, setFormStart, formDays, setFormDays, onSave, onPickCalendar, C, saveLabel="Zapisz blister" }) {
  const valid = formStart && parseInt(formDays) >= 1;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div>
        <div style={{fontSize:11,fontWeight:800,color:C.dark,opacity:1,
          marginBottom:6,letterSpacing:.8}}>POCZĄTEK BLISTRA</div>
        <div style={{display:"flex",gap:8}}>
          <input type="date" value={formStart} onChange={e=>setFormStart(e.target.value)}
            style={{ flex: 1, backgroundColor: '#FFF0F5', border: 'none', borderRadius: 14, padding: '12px 14px' }}/>
          <button onClick={onPickCalendar}
            style={{padding:"0 16px",borderRadius:14,border:"none",background:C.crimson,
              color:"white",fontSize:13,fontWeight:800,cursor:"pointer",whiteSpace:"nowrap",
              flexShrink:0}}>
            📅 Kalendarz
          </button>
        </div>
      </div>
 
      <div>
        <div style={{fontSize:11,fontWeight:800,color:C.dark,opacity:1,
          marginBottom:6,letterSpacing:.8}}>ILOŚĆ DNI</div>
        <input type="number" value={formDays} min="1" max="90"
          onChange={e=>setFormDays(e.target.value)} style={{borderRadius: 14}}/>
      </div>
 
      {formStart && parseInt(formDays) >= 1 && (
        <div style={{padding:"10px 16px",borderRadius:14,background:"#f0fff4",
          fontSize:13,fontWeight:700,color:"#27ae60"}}>
          📅 {formStart.split("-").reverse().slice(0,2).join(".")} → {(() => {
            const [y,m,d] = formStart.split("-").map(Number);
            const dt = new Date(y, m-1, d);
            dt.setDate(dt.getDate() + parseInt(formDays) - 1);
            return `${dt.getDate()}.${String(dt.getMonth()+1).padStart(2,"0")}`;
          })()}
          <span style={{opacity:.7}}> ({formDays} dni)</span>
        </div>
      )}
 
      <button onClick={onSave}
        style={{marginTop:4,padding:"16px",borderRadius:20,border:"none",
          cursor:valid?"pointer":"default",fontSize:16,fontWeight:800,color:"white",
          background:valid?C.crimson:C.blush,opacity:valid?1:.55,
          boxShadow:valid?"0 6px 20px rgba(200,29,58,.3)":"none"}}>
        {saveLabel}
      </button>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
